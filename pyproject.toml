[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-index-oracle"
version = "0.1.0"
description = "SQLite index advice gated on byte-identical results and actual query-plan use"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "linluozi"}]
keywords = ["sqlite", "index", "query-planner", "performance", "verification"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sqlite-index-oracle = "sqlite_index_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
